[job]
dump_folder = "./outputs/qwen3-4b-sft"
description = "Lightning-OPD Qwen3-4B-Base SFT on one trn2.48xlarge"

[profiling]
enable_profiling = false
save_traces_folder = "profile"
profile_freq = 100

[metrics]
log_freq = 1
enable_tensorboard = false
save_tb_folder = "tensorboard"
enable_wandb = true

[model]
name = "qwen3_sft"
flavor = "4B"
hf_assets_path = "/data/models/Qwen3-4B-Base"

[optimizer]
name = "AdamW"
lr = 8e-5
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
weight_decay = 0.0

[lr_scheduler]
warmup_steps = 300
decay_type = "cosine"

[training]
dataset = "lightning_opd_sft"
dataset_path = "/data/sft/openthoughts3_300k_qwen3-8b"
local_batch_size = 1
global_batch_size = 256
seq_len = 16384
max_norm = 1.0
steps = 3000
mixed_precision_param = "bfloat16"
mixed_precision_reduce = "float32"

[training.dataloader]
num_workers = 0
pin_memory = false
persistent_workers = false

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default"
tensor_parallel_degree = 4
context_parallel_degree = 1
pipeline_parallel_degree = 1

[checkpoint]
enable = true
folder = "checkpoint"
interval = 100
initial_load_model_only = true
initial_load_in_hf = true
last_save_model_only = false
last_save_in_hf = false
async_mode = "disabled"
keep_latest_k = 10

[activation_checkpoint]
mode = "selective"
selective_ac_option = "op"

[compile]
enable = false
components = ["model", "loss"]
backend = "neuron"

[debug]
seed = 42
deterministic = false
